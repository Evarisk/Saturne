name: Build assets (reusable)

on:
  workflow_call:
    # NOTE: workflow_call does not support `paths` filtering.
    # To avoid running this workflow when no SCSS/JS files changed,
    # add a `paths` filter in the *calling* workflow (e.g. build-assets.yml):
    #
    #   on:
    #     push:
    #       paths:
    #         - 'css/scss/**'
    #         - 'js/modules/**'
    #         - 'build-assets.js'
    inputs:
      module:
        description: 'Module name (e.g. reedcrm)'
        required: true
        type: string
      mode:
        # `commit` only works where github-actions[bot] may push straight to the
        # branch. A repository ruleset that requires a pull request applies to the
        # bot as much as to a human, so on such a repository every push is rejected
        # and the assets quietly stay stale. `verify` is the read-only counterpart:
        # it turns the same build into a check, which is also the only thing a pull
        # request coming from a fork can do, its GITHUB_TOKEN being read-only.
        description: '`commit` to push the rebuilt .min files, `verify` to fail when they are stale'
        required: false
        default: commit
        type: string

permissions:
  contents: write

# Two runs of this workflow on the same branch would both rebuild and both push.
# Queue them rather than cancel them: a cancelled run leaves the assets unbuilt.
concurrency:
  group: build-assets-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout calling module
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          # Checkout the branch, not the SHA: checking out a SHA leaves the runner on a
          # detached HEAD, and the `git push` of the commit step below then has no branch
          # to target (fatal: You are not currently on a branch).
          # In verify mode nothing is pushed and the run comes from a pull request, whose
          # github.ref_name is a merge ref and not a branch: let checkout pick its own
          # default, which is the merge commit we want to validate.
          ref: ${{ inputs.mode == 'commit' && github.ref_name || '' }}
          # Full history is what lets the commit step rebase when the branch moved while
          # the assets were building; a shallow clone has no common ancestor to rebase
          # onto. The depths are quoted because 0 is falsy in a GitHub expression, and an
          # unquoted 0 would make the `&& ... || ...` idiom fall through to the other branch.
          fetch-depth: ${{ inputs.mode == 'commit' && '0' || '1' }}

      - name: Checkout Saturne
        uses: actions/checkout@v4
        with:
          repository: Evarisk/Saturne
          ref: develop
          path: .saturne

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Saturne dependencies
        working-directory: .saturne
        run: npm ci

      - name: Build assets
        run: |
          node .saturne/build-assets.js --module=${{ inputs.module }}

      - name: Verify committed assets are up to date
        if: inputs.mode == 'verify'
        run: |
          # Staging before comparing gives the same verdict as the commit step,
          # including for a module that keeps its .min files out of git.
          git add --force css/${{ inputs.module }}.min.css js/${{ inputs.module }}.min.js
          if git diff --staged --quiet; then
            echo "Committed assets match a fresh build."
            exit 0
          fi
          git diff --staged --stat
          echo "::error::Committed .min files are stale. Rebuild them with the Saturne build (node .saturne/build-assets.js --module=${{ inputs.module }}) and commit css/${{ inputs.module }}.min.css and js/${{ inputs.module }}.min.js."
          exit 1

      - name: Commit built assets if changed
        if: inputs.mode == 'commit'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force css/${{ inputs.module }}.min.css js/${{ inputs.module }}.min.js
          if git diff --staged --quiet; then
            echo "Committed assets already match a fresh build, nothing to push."
            exit 0
          fi
          git commit -m "[CI] chore: build assets JS/CSS minified"
          # A merge landing while the assets were being built moves the branch and the
          # push then dies on `cannot lock ref` (seen on Eoxia/reedcrm run 34582923522).
          # Rebase onto the branch as it stands now and try again before giving up.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || break
          done
          # Without this the only trace of a ruleset rejection is the raw GH013 line from
          # the remote, which reads like a token problem and sends the reader looking at
          # `contents: write` instead of at the branch rules.
          echo "::error::Push refused on ${GITHUB_REF_NAME}. Either grant github-actions[bot] a bypass on the branch ruleset of ${GITHUB_REPOSITORY}, or call this workflow with mode: verify and keep committing the .min files by hand."
          exit 1
