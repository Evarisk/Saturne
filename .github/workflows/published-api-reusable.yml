---
name: API Saturne publiee (reusable)

# Controle « API Saturne publiee » (#1844). La CI qualite d'un module analyse son code contre
# Saturne `develop` : elle voit toujours le socle le plus recent, jamais celui que le client
# installera. Une fonction, une methode, une classe ou un fichier ajoutes au socle depuis son
# dernier tag passaient donc au vert, et le decalage ne se voyait qu'a la release ou chez le client
# (Digirisk 23.2.0 et 23.2.1, DoliMeet 23.1.3 suspendue le 12/10 sur fetchUserSignatory()).
#
# dev/ci/published-api.php fait la difference entre Saturne `develop` et son dernier tag X.Y.Z,
# puis cherche les appels dans le module. Sur une pull request, il separe ceux que la PR introduit
# (le job sort rouge) de ceux que la base portait deja (annotation seule). Rien n'est ecrit : ni
# commentaire ni etiquette, le jeton d'une PR venue d'un fork est en lecture seule.
#
# Un module l'appelle depuis son quality.yml :
#
#     saturne-api:
#         name: Saturne
#         uses: Evarisk/Saturne/.github/workflows/published-api-reusable.yml@develop
#         with:
#             module: dolimeet
#
# Le contexte publie s'appelle alors « Saturne / API publiee ». Ne pas l'ajouter aux verifications
# requises du ruleset : appeler de l'API non publiee est normal pendant le developpement, il faut
# seulement publier Saturne avant la release du module. Le check informe, il ne bloque pas.
#
# Rejouer un cas en local, sans CI (shas, branches et tags du clone) :
#     php dev/ci/published-api.php --saturne=. --saturne-ref=<sha> --published=23.2.1 \
#         --module=../dolimeet --head=<sha> --base=<sha>^1

on:
    workflow_call:
        inputs:
            module:
                description: 'Dossier du module sous htdocs/custom (ex. dolimeet)'
                required: true
                type: string
            saturne-ref:
                description: 'Saturne analyse : develop, ou une branche ou un sha complet de Evarisk/Saturne'
                required: false
                default: develop
                type: string
            published-tag:
                description: 'Version publiee de reference, vide pour le plus grand tag X.Y.Z de Evarisk/Saturne'
                required: false
                default: ''
                type: string
            # Pour essayer une evolution du controle depuis un fork, avant son merge : le workflow
            # appele ne connait pas la reference par laquelle on l'appelle.
            script-repository:
                description: 'Depot qui fournit dev/ci/published-api.php'
                required: false
                default: Evarisk/Saturne
                type: string
            script-ref:
                description: 'Branche de ce depot'
                required: false
                default: develop
                type: string

permissions:
    contents: read

jobs:
    check:
        name: API publiee
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read

        steps:
            # A la racine de l'espace de travail : les chemins des annotations sont ceux du module.
            # Profondeur 2 : sur une pull request, HEAD est le commit de fusion de la PR dans sa base,
            # et son premier parent est cette base.
            - name: Checkout du module
              uses: actions/checkout@v5
              with:
                  fetch-depth: 2
                  persist-credentials: false

            # Le Saturne analyse et son tag publie sont lus par git dans ce clone, sans checkout du tag.
            - name: Checkout de Saturne
              uses: actions/checkout@v5
              with:
                  repository: Evarisk/Saturne
                  ref: develop
                  path: .saturne
                  fetch-depth: 1
                  persist-credentials: false

            - name: Checkout du controle
              uses: actions/checkout@v5
              with:
                  repository: ${{ inputs.script-repository }}
                  ref: ${{ inputs.script-ref }}
                  path: .saturne-ci
                  fetch-depth: 1
                  persist-credentials: false
                  sparse-checkout: dev/ci

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.1'
                  coverage: none

            - name: Appels a de l'API Saturne non publiee
              env:
                  MODULE: ${{ inputs.module }}
                  SATURNE_REF: ${{ inputs.saturne-ref }}
                  PUBLISHED_TAG: ${{ inputs.published-tag }}
                  EVENT_NAME: ${{ github.event_name }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  set -euo pipefail

                  # Une revision presente dans le clone superficiel se resout sur place, un sha absent
                  # se recupere seul (GitHub ne sert pas un commit par son sha abrege).
                  resolve() {
                      if ! git -C "$1" rev-parse --verify --quiet "$2^{commit}"; then
                          git -C "$1" fetch --quiet --no-tags --depth=1 origin "$2"
                          git -C "$1" rev-parse FETCH_HEAD
                      fi
                  }

                  if [ "$SATURNE_REF" = "develop" ]; then
                      saturne=$(git -C .saturne rev-parse HEAD)
                  else
                      saturne=$(resolve .saturne "$SATURNE_REF")
                  fi

                  tag=$PUBLISHED_TAG
                  if [ -z "$tag" ]; then
                      tag=$(git -C .saturne ls-remote --tags --refs origin | sed 's#.*refs/tags/##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
                  fi
                  git -C .saturne fetch --quiet --no-tags --depth=1 origin "refs/tags/$tag:refs/tags/$tag"

                  # Hors pull request (push sur develop), pas de base : tout appel releve est « deja
                  # sur la branche » et le job reste vert.
                  base=""
                  if [ "$EVENT_NAME" = "pull_request" ]; then
                      if git rev-parse --verify --quiet HEAD^2 >/dev/null; then
                          base=$(git rev-parse HEAD^1)
                      else
                          base=$(resolve . "$PR_BASE_SHA")
                      fi
                  fi

                  echo "Module $MODULE a $(git rev-parse --short HEAD), base ${base:-aucune}, Saturne ${saturne:0:8} contre $tag"
                  php .saturne-ci/dev/ci/published-api.php \
                      --saturne=.saturne \
                      --saturne-ref="$saturne" \
                      --published="$tag" \
                      --module=. \
                      --head=HEAD \
                      --base="$base" \
                      --name="$MODULE"
